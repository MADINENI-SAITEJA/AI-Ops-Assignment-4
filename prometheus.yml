global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: caption_app
    static_configs:
      - targets: ['127.0.0.1:18000']
        labels:
          application: image_captioning
          environment: utm_vm

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: alert_receiver
    static_configs:
      - targets: ['127.0.0.1:18001']

# AI assistance: ChatGPT helped generate application/metrics code,
# PromQL queries and monitoring configuration, and assisted with debugging.
# ZIP and validation tests, and selected dashboard layout/presentation changes.

# Dashboard query-generation prompt (original metric module: instrumentation.py):
# "Generate PromQL for the named panel using instrumentation.py; use 1m rate
# windows, aggregate histogram buckets by le before histogram_quantile,
# and leave undefined idle latency undefined."

# Client-count prompt:
# "Show cumulative submitted requests by session_id, mode and ip_class
# since application start, without increase()."

# Single/bulk CPU comparison prompt:
# "Show the one-minute rate of measured process CPU seconds by inference
# mode as a percentage of total guest logical CPU capacity; this
# deployment has one node exporter."

# Query notes:
# Mean latency = duration rate / observation-count rate.
# p95 is estimated from histogram buckets.
# Client counts reset on application restart.
# CPU percentage = 100 * CPU seconds per second / guest logical CPU count.